<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Lashan Gagunasekara</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('https://lashangagunasekara.com/bgd.webp') no-repeat center center/cover;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            position: relative;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Dark overlay for readability */
        }
        .content {
            position: relative;
            z-index: 2;
            max-width: 600px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            animation: fadeIn 2s ease-in-out;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .countdown {
            font-size: 1.5rem;
            font-weight: bold;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="content">
        <h1>Our Site is Coming Soon</h1>
        <p>We are working on something amazing. Stay tuned!</p>
        <p class="countdown" id="countdown"></p>
    </div>

    <script>
        function countdownTimer() {
            const now = new Date();
            const targetTime = new Date(now.getTime() + 24 * 60 * 60 * 1000); // 24 hours from now
            
            const timer = setInterval(() => {
                const currentTime = new Date().getTime();
                const distance = targetTime - currentTime;

                if (distance <= 0) {
                    clearInterval(timer);
                    document.getElementById("countdown").innerHTML = "We are live!";
                } else {
                    const hours = Math.floor(distance / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    document.getElementById("countdown").innerHTML = `Launching in: ${hours}h ${minutes}m ${seconds}s`;
                }
            }, 1000);
        }
        countdownTimer();
    </script>

</body>
</html>
